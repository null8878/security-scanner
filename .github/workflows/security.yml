name: Security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - name: Bandit
        run: bandit -r . -ll 2>/dev/null || true
      - name: Safety check
        run: safety check 2>/dev/null || true
